name = "claude-code-sandbox"
type = "sandbox"
description = "Claude Agent SDK sandbox with HTTP/SSE chat on port 4100"

[runtime]
generation = "mk3"
memory = 4096

[[runtime.ports]]
name = "sandbox-api"
target = 8080
protocol = "HTTP"

[[runtime.ports]]
name = "agent-server"
target = 4100
protocol = "HTTP"
